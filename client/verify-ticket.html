    <section class="verify-section">

        <div class="verify-card">

            <h1>🎟️ Verify Ticket</h1>

            <p>
                Enter the ticket ID to verify a customer's ticket.
            </p>


            <form id="verifyForm">

                <input
                    type="text"
                    id="ticketId"
                    placeholder="e.g. EVT-7F3K92LA"
                    required
                >

                <button type="submit">
                    Verify Ticket
                </button>

            </form>


            <div id="verifyResult"></div>

        </div>

    </section>


    <script src="verify-ticket.js"></script>
